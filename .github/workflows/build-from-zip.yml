name: Build MiniBox firmware from ZIP

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/test-openwrt-source-injection.sh'
      - 'tests/test-web-ui.sh'
      - 'package/minibox-mfp/**'
      - '.github/workflows/build-from-zip.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/test-openwrt-source-injection.sh'
      - 'tests/test-web-ui.sh'
      - 'package/minibox-mfp/**'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

concurrency:
  group: minibox-build-0104
  cancel-in-progress: true

env:
  ARCHIVE: MiniBox-MFP-Firmware-Build-0104-AR9330-OPENWRT-25.12.5-CANDIDATE-BUILD-KIT.zip
  EXPECTED_SHA256: 77974510f54a23dd633d5f451eac72cec432116bb01710a46bd0b8bb3f050381
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt-src
  DIST_DIR: dist

jobs:
  build:
    name: OpenWrt 25.12.5 / MiniBox V1
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test OpenWrt package source injection contract
        shell: bash
        run: |
          tests/test-openwrt-source-injection.sh
          sh tests/test-web-ui.sh

      - name: Check ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum -c -

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake autopoint bison clang cmake cpio curl device-tree-compiler file flex g++ g++-multilib gawk gcc-multilib gettext git jq libelf-dev libgmp-dev libmpc-dev libmpfr-dev libncurses-dev libssl-dev libtool libzstd-dev ninja-build patch perl pkgconf python3 python3-pyelftools python3-setuptools rsync squashfs-tools subversion swig tar unzip wget xz-utils zlib1g-dev zstd

      - name: Extract Build-0104 ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          KIT_ROOT="$(find extracted -type f -name BUILD_INFO.md -printf '%h\n' -quit)"
          test -n "$KIT_ROOT"
          KIT_ROOT="$(realpath "$KIT_ROOT")"
          echo "KIT_ROOT=$KIT_ROOT" >> "$GITHUB_ENV"

      - name: Clone pinned OpenWrt source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$OPENWRT_TAG" https://git.openwrt.org/openwrt/openwrt.git "$OPENWRT_DIR"

      - name: Enable OpenWrt package feeds
        shell: bash
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          ./scripts/feeds update packages
          ./scripts/feeds install -p packages libusb1 avahi
          test -e package/feeds/packages/avahi

      - name: Inject board port and live MiniBox package
        shell: bash
        run: |
          set -euo pipefail
          DEST="$(realpath "$OPENWRT_DIR")"
          INJECTOR="$KIT_ROOT/scripts/inject-openwrt-tree.py"
          reset_openwrt() { git -C "$DEST" reset --hard HEAD >/dev/null; git -C "$DEST" clean -fdx -e feeds -e package/feeds >/dev/null; }
          profile_present() { grep -Rqs 'gainstrong_minibox-v1' "$DEST/target/linux/ath79"; }
          attempt() {
            local description="$1"; shift
            reset_openwrt
            if (cd "$KIT_ROOT" && python3 "$INJECTOR" "$@"); then profile_present && return 0; fi
            return 1
          }
          if attempt positional "$DEST"; then :
          elif attempt openwrt --openwrt "$DEST"; then :
          elif attempt openwrt-root --openwrt-root "$DEST"; then :
          elif attempt tree --tree "$DEST"; then :
          elif attempt kit "$KIT_ROOT" "$DEST"; then :
          else echo 'ERROR: board injector failed'; exit 1; fi

          rm -rf "$DEST/package/minibox-mfp" "$DEST/src"
          cp -a "$GITHUB_WORKSPACE/package/minibox-mfp" "$DEST/package/minibox-mfp"
          cp -a "$GITHUB_WORKSPACE/src" "$DEST/src"
          test -f "$DEST/package/minibox-mfp/Makefile"
          test -f "$DEST/src/minibox-printerd/main.c"
          test -f "$DEST/src/minibox-scand/main.c"
          test -f "$DEST/package/minibox-mfp/src/m1522_usb_transport.c"
          test -f "$DEST/package/minibox-mfp/files/usr/sbin/minibox-m1522-descriptors"

      - name: Configure OpenWrt
        shell: bash
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          cp "$KIT_ROOT/openwrt.config" .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_minibox-mfp=y
          CONFIG_PACKAGE_libusb-1.0=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_uhttpd=y
          # CONFIG_PACKAGE_kmod-usb-printer is not set
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_ath79_generic_DEVICE_gainstrong_minibox-v1=y$' .config
          grep -q '^CONFIG_PACKAGE_minibox-mfp=y$' .config
          grep -q '^CONFIG_PACKAGE_uhttpd=y$' .config
          ! grep -Eq '^CONFIG_PACKAGE_(luci|luci-light)=y$' .config
          ! grep -q '^CONFIG_PACKAGE_kmod-usb-printer=y$' .config

      - name: Restore OpenWrt build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt-src/dl
            openwrt-src/staging_dir
            openwrt-src/build_dir
          key: minibox-openwrt-v25.12.5-ath79-livepkg-v2-${{ runner.os }}
          restore-keys: |
            minibox-openwrt-v25.12.5-ath79-livepkg-

      - name: Download OpenWrt sources
        shell: bash
        working-directory: openwrt-src
        run: |
          set -o pipefail
          make -j"$(nproc)" download 2>&1 | tee "$GITHUB_WORKSPACE/download.log" || make -j1 V=s download 2>&1 | tee -a "$GITHUB_WORKSPACE/download.log"

      - name: Build firmware
        shell: bash
        working-directory: openwrt-src
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || make -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Verify web UI and uhttpd autostart in squashfs
        id: web_ui_check
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          TARGET_DIR="$OPENWRT_DIR/bin/targets/ath79/generic"
          ROOTFS="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*root.squashfs' -print -quit)"
          REPORT="$GITHUB_WORKSPACE/WEB-UI-IMAGE-CHECKS.txt"
          : > "$REPORT"
          failures=0
          check() {
            local label="$1"
            shift
            if "$@"; then
              printf 'PASS %s\n' "$label" | tee -a "$REPORT"
            else
              printf 'FAIL %s\n' "$label" | tee -a "$REPORT" >&2
              failures=$((failures + 1))
            fi
          }

          if [ -z "$ROOTFS" ]; then
            FIRMWARE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*minibox*squashfs-factory.bin' -print -quit)"
            if [ -z "$FIRMWARE" ]; then
              printf 'FAIL neither root.squashfs nor MiniBox factory image found in %s\n' "$TARGET_DIR" | tee -a "$REPORT" >&2
              find "$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort | tee -a "$REPORT"
              exit 1
            fi

            ROOTFS="$GITHUB_WORKSPACE/embedded-root.squashfs"
            python3 - "$FIRMWARE" "$ROOTFS" <<'PY' | tee -a "$REPORT"
          import struct
          import sys

          source, destination = sys.argv[1:]
          image = open(source, "rb").read()
          offset = image.find(b"hsqs")
          if offset < 0:
              raise SystemExit("FAIL SquashFS magic not found in factory image")
          if offset + 48 > len(image):
              raise SystemExit("FAIL truncated SquashFS superblock in factory image")
          bytes_used = struct.unpack_from("<Q", image, offset + 40)[0]
          if bytes_used < 96 or offset + bytes_used > len(image):
              raise SystemExit("FAIL invalid SquashFS length in factory image")
          with open(destination, "wb") as output:
              output.write(image[offset:offset + bytes_used])
          print(f"factory={source.rsplit('/', 1)[-1]}")
          print(f"squashfs_offset={offset}")
          print(f"squashfs_bytes={bytes_used}")
          PY
          fi

          rm -rf rootfs-inspect
          if ! unsquashfs -no-progress -d rootfs-inspect "$ROOTFS" >/dev/null; then
            printf 'FAIL unable to extract %s\n' "$(basename "$ROOTFS")" | tee -a "$REPORT" >&2
            exit 1
          fi

          printf 'rootfs=%s\n' "$(basename "$ROOTFS")" | tee -a "$REPORT"
          check '/usr/sbin/uhttpd executable' test -x rootfs-inspect/usr/sbin/uhttpd
          check '/etc/config/uhttpd present' test -s rootfs-inspect/etc/config/uhttpd
          check '/etc/init.d/uhttpd executable' test -x rootfs-inspect/etc/init.d/uhttpd
          check '/www/index.html present' test -s rootfs-inspect/www/index.html
          check '/www/minibox/index.html present' test -s rootfs-inspect/www/minibox/index.html
          check '/www/minibox/app.js present' test -s rootfs-inspect/www/minibox/app.js
          check '/www/cgi-bin/minibox-status executable' test -x rootfs-inspect/www/cgi-bin/minibox-status

          UHTTPD_LINK="$(find rootfs-inspect/etc/rc.d -type l -name 'S??uhttpd' -print -quit 2>/dev/null)"
          check 'uhttpd boot symlink present' test -n "$UHTTPD_LINK"
          check 'MiniBox UI marker present' grep -q 'MiniBox print + scan server' rootfs-inspect/www/index.html

          printf '%s\n' '--- /www inventory ---' | tee -a "$REPORT"
          find rootfs-inspect/www -maxdepth 3 -printf '%M %P\n' 2>/dev/null | sort | tee -a "$REPORT"
          printf '%s\n' '--- uhttpd boot links ---' | tee -a "$REPORT"
          find rootfs-inspect/etc/rc.d -type l -name '*uhttpd' -printf '%P -> %l\n' 2>/dev/null | sort | tee -a "$REPORT"

          if [ "$failures" -ne 0 ]; then
            printf 'RESULT FAIL (%d checks)\n' "$failures" | tee -a "$REPORT" >&2
            exit 1
          fi
          printf '%s\n' 'RESULT PASS' | tee -a "$REPORT"

      - name: Collect firmware and package
        if: ${{ success() || steps.web_ui_check.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DIST_DIR"; mkdir -p "$DIST_DIR"
          TARGET_DIR="$OPENWRT_DIR/bin/targets/ath79/generic"
          find "$TARGET_DIR" -maxdepth 1 -type f -iname '*minibox*.bin' -exec cp -v {} "$DIST_DIR/" \;
          find "$TARGET_DIR" -maxdepth 1 -type f \( -name '*.manifest' -o -name 'profiles.json' \) -exec cp -v {} "$DIST_DIR/" \;
          find "$OPENWRT_DIR/bin/packages" -type f -iname 'minibox-mfp*.apk' -exec cp -v {} "$DIST_DIR/" \; 2>/dev/null || true
          INITRAMFS="$(find "$DIST_DIR" -type f -iname '*minibox*initramfs-kernel.bin' -print -quit)"
          FACTORY="$(find "$DIST_DIR" -type f -iname '*minibox*squashfs-factory.bin' -print -quit)"
          SYSUPGRADE="$(find "$DIST_DIR" -type f -iname '*minibox*squashfs-sysupgrade.bin' -print -quit)"
          APK="$(find "$DIST_DIR" -type f -iname 'minibox-mfp*.apk' -print -quit)"
          test -n "$INITRAMFS"
          test -n "$FACTORY"
          test -n "$SYSUPGRADE"
          test -n "$APK"
          test "$(stat -c%s "$FACTORY")" -le 16580608
          cp WEB-UI-IMAGE-CHECKS.txt "$DIST_DIR/"
          git rev-parse HEAD > "$DIST_DIR/SOURCE-COMMIT.txt"
          cp docs/FINALIZATION-AUDIT-2026-09-20.md "$DIST_DIR/ROLLBACK-AND-MANUAL-TEST.md"
          printf '%s\n' 'TEST-ONLY: hardware validation pending; flash_allowed=false' > "$DIST_DIR/READ-ME-FIRST.txt"
          cat > "$DIST_DIR/SBOM.spdx" <<EOF
          SPDXVersion: SPDX-2.3
          DataLicense: CC0-1.0
          SPDXID: SPDXRef-DOCUMENT
          DocumentName: MiniBox-post-merge-TEST
          DocumentNamespace: https://github.com/desfly/MiniBox-print-scan-server/actions/runs/${GITHUB_RUN_ID}/sbom
          Creator: Tool: GitHub-Actions
          Created: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          PackageName: minibox-firmware-test
          SPDXID: SPDXRef-Package
          PackageVersion: ${GITHUB_SHA}
          PackageDownloadLocation: NOASSERTION
          FilesAnalyzed: false
          PackageLicenseConcluded: NOASSERTION
          PackageLicenseDeclared: NOASSERTION
          PackageCopyrightText: NOASSERTION
          EOF
          find "$DIST_DIR" -maxdepth 1 -type f ! -name BUILD-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$DIST_DIR/BUILD-SHA256SUMS.txt"

      - name: Upload MiniBox firmware artifact
        if: ${{ success() || steps.web_ui_check.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: minibox-v1-openwrt-25.12.5-integrated-web-ui-TEST-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Enforce web UI image verification
        if: ${{ always() && steps.web_ui_check.outcome == 'failure' }}
        shell: bash
        run: |
          echo 'Web UI image verification failed; see WEB-UI-IMAGE-CHECKS.txt in the uploaded artifact.' >&2
          exit 1
