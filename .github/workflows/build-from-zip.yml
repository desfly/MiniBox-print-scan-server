name: Build MiniBox firmware from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package/minibox-mfp/**'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

concurrency:
  group: minibox-build-0104
  cancel-in-progress: true

env:
  ARCHIVE: MiniBox-MFP-Firmware-Build-0104-AR9330-OPENWRT-25.12.5-CANDIDATE-BUILD-KIT.zip
  EXPECTED_SHA256: 77974510f54a23dd633d5f451eac72cec432116bb01710a46bd0b8bb3f050381
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt-src
  DIST_DIR: dist

jobs:
  build:
    name: OpenWrt 25.12.5 / MiniBox V1
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum -c -

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake autopoint bison clang cmake cpio curl device-tree-compiler file flex g++ g++-multilib gawk gcc-multilib gettext git jq libelf-dev libgmp-dev libmpc-dev libmpfr-dev libncurses-dev libssl-dev libtool libzstd-dev ninja-build patch perl pkgconf python3 python3-pyelftools python3-setuptools rsync subversion swig tar unzip wget xz-utils zlib1g-dev zstd

      - name: Extract Build-0104 ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          KIT_ROOT="$(find extracted -type f -name BUILD_INFO.md -printf '%h\n' -quit)"
          test -n "$KIT_ROOT"
          KIT_ROOT="$(realpath "$KIT_ROOT")"
          echo "KIT_ROOT=$KIT_ROOT" >> "$GITHUB_ENV"

      - name: Clone pinned OpenWrt source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$OPENWRT_TAG" https://git.openwrt.org/openwrt/openwrt.git "$OPENWRT_DIR"

      - name: Enable OpenWrt package feeds
        shell: bash
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          ./scripts/feeds update packages
          ./scripts/feeds install -p packages libusb1 avahi
          test -e package/feeds/packages/avahi

      - name: Inject board port and live MiniBox package
        shell: bash
        run: |
          set -euo pipefail
          DEST="$(realpath "$OPENWRT_DIR")"
          INJECTOR="$KIT_ROOT/scripts/inject-openwrt-tree.py"
          reset_openwrt() { git -C "$DEST" reset --hard HEAD >/dev/null; git -C "$DEST" clean -fdx -e feeds -e package/feeds >/dev/null; }
          profile_present() { grep -Rqs 'gainstrong_minibox-v1' "$DEST/target/linux/ath79"; }
          attempt() {
            local description="$1"; shift
            reset_openwrt
            if (cd "$KIT_ROOT" && python3 "$INJECTOR" "$@"); then profile_present && return 0; fi
            return 1
          }
          if attempt positional "$DEST"; then :
          elif attempt openwrt --openwrt "$DEST"; then :
          elif attempt openwrt-root --openwrt-root "$DEST"; then :
          elif attempt tree --tree "$DEST"; then :
          elif attempt kit "$KIT_ROOT" "$DEST"; then :
          else echo 'ERROR: board injector failed'; exit 1; fi

          rm -rf "$DEST/package/minibox-mfp"
          cp -a "$GITHUB_WORKSPACE/package/minibox-mfp" "$DEST/package/minibox-mfp"
          test -f "$DEST/package/minibox-mfp/Makefile"
          test -f "$DEST/package/minibox-mfp/src/m1522_usb_transport.c"
          test -f "$DEST/package/minibox-mfp/files/usr/sbin/minibox-m1522-descriptors"

      - name: Configure OpenWrt
        shell: bash
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          cp "$KIT_ROOT/openwrt.config" .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_minibox-mfp=y
          CONFIG_PACKAGE_libusb-1.0=y
          CONFIG_PACKAGE_kmod-usb2=y
          # CONFIG_PACKAGE_kmod-usb-printer is not set
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_ath79_generic_DEVICE_gainstrong_minibox-v1=y$' .config
          grep -q '^CONFIG_PACKAGE_minibox-mfp=y$' .config
          ! grep -q '^CONFIG_PACKAGE_kmod-usb-printer=y$' .config

      - name: Restore OpenWrt build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt-src/dl
            openwrt-src/staging_dir
            openwrt-src/build_dir
          key: minibox-openwrt-v25.12.5-ath79-livepkg-v2-${{ runner.os }}
          restore-keys: |
            minibox-openwrt-v25.12.5-ath79-livepkg-

      - name: Download OpenWrt sources
        shell: bash
        working-directory: openwrt-src
        run: |
          set -o pipefail
          make -j"$(nproc)" download 2>&1 | tee "$GITHUB_WORKSPACE/download.log" || make -j1 V=s download 2>&1 | tee -a "$GITHUB_WORKSPACE/download.log"

      - name: Build firmware
        shell: bash
        working-directory: openwrt-src
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || make -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Collect firmware and package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DIST_DIR"; mkdir -p "$DIST_DIR"
          TARGET_DIR="$OPENWRT_DIR/bin/targets/ath79/generic"
          find "$TARGET_DIR" -maxdepth 1 -type f -iname '*minibox*.bin' -exec cp -v {} "$DIST_DIR/" \;
          find "$OPENWRT_DIR/bin/packages" -type f -iname 'minibox-mfp*.apk' -exec cp -v {} "$DIST_DIR/" \; 2>/dev/null || true
          INITRAMFS="$(find "$DIST_DIR" -type f -iname '*minibox*initramfs-kernel.bin' -print -quit)"
          SYSUPGRADE="$(find "$DIST_DIR" -type f -iname '*minibox*squashfs-sysupgrade.bin' -print -quit)"
          APK="$(find "$DIST_DIR" -type f -iname 'minibox-mfp*.apk' -print -quit)"
          test -n "$INITRAMFS"
          test -n "$SYSUPGRADE"
          test -n "$APK"
          sha256sum "$DIST_DIR"/* > "$DIST_DIR/BUILD-SHA256SUMS.txt"

      - name: Upload MiniBox firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: minibox-v1-openwrt-25.12.5-live-package-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
