name: Build MiniBox runtime package

on:
  push:
    branches:
      - minibox-network-mfp-runtime-v2
      - audit/minibox-finalize-20260920
    paths:
      - 'src/**'
      - 'package/minibox-mfp/**'
      - '.github/workflows/build-runtime-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minibox-runtime-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout runtime-v2
        uses: actions/checkout@v7

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential curl file rsync tar xz-utils zstd

      - name: Download OpenWrt 25.12.5 ath79 generic SDK
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://downloads.openwrt.org/releases/25.12.5/targets/ath79/generic'
          SDK_FILE='openwrt-sdk-25.12.5-ath79-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
          SDK_SHA256='bc4307ae2065c0c0b7c84627356e9f3d368a5a803c81552fcb77aa034a843f5a'
          echo "SDK_FILE=$SDK_FILE" >> "$GITHUB_ENV"
          curl -fL --retry 4 "$BASE/$SDK_FILE" -o "$SDK_FILE"
          echo "$SDK_SHA256  $SDK_FILE" | sha256sum -c -
          mkdir sdk
          tar --zstd -xf "$SDK_FILE" -C sdk --strip-components=1

      - name: Overlay MiniBox 0.3.0 runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdk/package/minibox-mfp sdk/src
          mkdir -p sdk/package sdk/src
          cp -a package/minibox-mfp sdk/package/minibox-mfp
          cp -a src/. sdk/src/
          grep -E '^PKG_(NAME|VERSION|RELEASE)' sdk/package/minibox-mfp/Makefile
          grep -q '^PKG_VERSION:=0.3.0$' sdk/package/minibox-mfp/Makefile

      - name: Restore OpenWrt libusb package definition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sdk/package/libs/libusb
          curl -fsSL --retry 4 \
            'https://raw.githubusercontent.com/openwrt/openwrt/v25.12.5/package/libs/libusb/Makefile' \
            -o sdk/package/libs/libusb/Makefile
          grep -q '^PKG_VERSION:=1.0.29$' sdk/package/libs/libusb/Makefile
          grep -q 'Package/libusb-1.0' sdk/package/libs/libusb/Makefile

      - name: Build minibox-mfp APK
        working-directory: sdk
        shell: bash
        run: |
          set -euo pipefail
          make defconfig
          make package/libs/libusb/compile -j"$(nproc)" V=s
          make package/minibox-mfp/compile -j"$(nproc)" V=s

      - name: Collect runtime package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          find sdk/bin -type f \( -name 'minibox-mfp-*.apk' -o -name 'minibox-mfp-*.ipk' \) -print -exec cp -v {} dist/ \;
          test "$(find dist -type f | wc -l)" -gt 0
          cp package/minibox-mfp/Makefile dist/package-Makefile.txt
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          cp docs/FINALIZATION-AUDIT-2026-09-20.md dist/ROLLBACK-AND-MANUAL-TEST.md
          printf '%s\n' 'TEST PACKAGE ONLY — hardware validation pending; do not treat as production-ready.' > dist/TEST-ONLY.txt
          find dist -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload MiniBox runtime package
        uses: actions/upload-artifact@v4
        with:
          name: minibox-mfp-r12-TEST-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
