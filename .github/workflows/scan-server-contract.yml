name: MiniBox scan server contract
on:
  push:
    branches: [minibox-network-mfp-runtime-v2]
  workflow_dispatch:
jobs:
  scan-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scan service contract
        run: sh tests/test_scan_contract.sh
      - name: Compile SOAPHT HTTP parser
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic src/minibox-scan/soapht_http.c tests/test_soapht_http.c -o /tmp/test-soapht-http
      - name: Test SOAPHT HTTP parser
        run: /tmp/test-soapht-http
      - name: Test SOAPHT transcript analyzer
        run: python3 tests/test_soapht_transcript.py
