name: Build MiniBox Build-0108 TEST-ONLY finalization candidate
on:
  workflow_dispatch:
  push:
    branches: [minibox-network-mfp-runtime-v2, audit/minibox-finalize-20260920]
    paths: ['src/**','package/minibox-mfp/**','.github/workflows/build-web-upgrade.yml']
permissions:
  contents: read
concurrency:
  group: minibox-web-upgrade-0107
  cancel-in-progress: false
env:
  ARCHIVE: MiniBox-MFP-Firmware-Build-0104-AR9330-OPENWRT-25.12.5-CANDIDATE-BUILD-KIT.zip
  EXPECTED_SHA256: 77974510f54a23dd633d5f451eac72cec432116bb01710a46bd0b8bb3f050381
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt-src
  DIST_DIR: dist-web-upgrade
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Verify board source kit
        run: echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum -c -
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake autopoint bison clang cmake cpio curl device-tree-compiler file flex g++ g++-multilib gawk gcc-multilib gettext git jq libelf-dev libgmp-dev libmpc-dev libmpfr-dev libncurses-dev libssl-dev libtool libzstd-dev ninja-build patch perl pkgconf python3 python3-pyelftools python3-setuptools rsync subversion swig tar unzip wget xz-utils zlib1g-dev zstd
      - name: Test MFP runtime
        run: |
          ./tests/test-mfp-core.sh
          ./tests/test_scan_contract.sh
      - name: Extract board kit
        run: |
          rm -rf extracted && mkdir extracted && unzip -q "$ARCHIVE" -d extracted
          KIT_ROOT="$(find extracted -type f -name BUILD_INFO.md -printf '%h\n' -quit)"
          test -n "$KIT_ROOT"
          echo "KIT_ROOT=$(realpath "$KIT_ROOT")" >> "$GITHUB_ENV"
      - name: Clone OpenWrt
        run: git clone --depth 1 --branch "$OPENWRT_TAG" https://git.openwrt.org/openwrt/openwrt.git "$OPENWRT_DIR"
      - name: Inject board then current runtime
        run: |
          set -euo pipefail
          DEST="$(realpath "$OPENWRT_DIR")"; INJECTOR="$KIT_ROOT/scripts/inject-openwrt-tree.py"
          reset(){ git -C "$DEST" reset --hard HEAD >/dev/null; git -C "$DEST" clean -fdx >/dev/null; }
          ok(){ grep -Rqs 'gainstrong_minibox-v1' "$DEST/target/linux/ath79"; }
          attempt(){ reset; (cd "$KIT_ROOT" && python3 "$INJECTOR" "$@") && ok; }
          attempt "$DEST" || attempt --openwrt "$DEST" || attempt --openwrt-root "$DEST" || attempt --tree "$DEST" || attempt "$KIT_ROOT" "$DEST"
          ok
          rm -rf "$DEST/package/minibox-mfp" "$DEST/src"
          cp -a "$GITHUB_WORKSPACE/package/minibox-mfp" "$DEST/package/minibox-mfp"
          cp -a "$GITHUB_WORKSPACE/src" "$DEST/src"
          grep -q 'minibox-scan-diag' "$DEST/package/minibox-mfp/Makefile"
          grep -Eq 'minibox_soapht_codec[[:space:]]*=[[:space:]]*&verified_m1522_codec' "$DEST/src/minibox-scan/soapht_codec.c"
          test ! -e "$DEST/package/minibox-mfp/files/usr/libexec/minibox-mfp/soapht-usb"
      - name: Feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update packages luci
          ./scripts/feeds install -p packages cgi-io
          ./scripts/feeds install -p luci luci-light
      - name: Configure
        working-directory: openwrt-src
        run: |
          cp "$KIT_ROOT/openwrt.config" .config
          printf '\nCONFIG_PACKAGE_minibox-mfp=y\nCONFIG_PACKAGE_libusb-1.0=y\nCONFIG_PACKAGE_luci-light=y\n# CONFIG_PACKAGE_kmod-usb-printer is not set\n' >> .config
          make defconfig
          grep -q '^CONFIG_TARGET_ath79_generic_DEVICE_gainstrong_minibox-v1=y$' .config
          grep -q '^CONFIG_PACKAGE_minibox-mfp=y$' .config
          ! grep -q '^CONFIG_PACKAGE_kmod-usb-printer=y$' .config
      - name: Build
        working-directory: openwrt-src
        run: |
          make -j"$(nproc)" download
          make -j"$(nproc)" || make -j1 V=s
      - name: Collect Build-0108 TEST-ONLY
        run: |
          set -euo pipefail
          T="$OPENWRT_DIR/bin/targets/ath79/generic"; mkdir -p "$DIST_DIR"
          I="$(find "$T" -maxdepth 1 -type f -iname '*gainstrong_minibox-v1*initramfs-kernel.bin' -print -quit)"
          F="$(find "$T" -maxdepth 1 -type f -iname '*gainstrong_minibox-v1*squashfs-factory.bin' -print -quit)"
          S="$(find "$T" -maxdepth 1 -type f -iname '*gainstrong_minibox-v1*squashfs-sysupgrade.bin' -print -quit)"
          test -f "$F" && test -f "$S" && test "$(stat -c%s "$F")" -le 16580608
          if test -n "$I"; then cp "$I" "$DIST_DIR/"; fi
          cp "$F" "$S" "$DIST_DIR/"
          find "$OPENWRT_DIR/bin/packages" -type f -name 'minibox-mfp*.apk' -exec cp {} "$DIST_DIR/" \;
          find "$T" -maxdepth 1 -type f -name '*.manifest' -exec cp {} "$DIST_DIR/OPENWRT-PACKAGES.manifest" \; -quit
          git rev-parse HEAD > "$DIST_DIR/SOURCE-COMMIT.txt"
          cp docs/FINALIZATION-AUDIT-2026-09-20.md "$DIST_DIR/ROLLBACK-AND-MANUAL-TEST.md"
          cat > "$DIST_DIR/READ-ME-FIRST.txt" <<'EOF'
          MiniBox Build-0108 TEST-ONLY candidate. Hardware validation is pending.
          flash_allowed=false
          Preferred first test: RAM boot of initramfs, when present.
          DO NOT write factory/sysupgrade images until the user explicitly chooses to test
          after reviewing ROLLBACK-AND-MANUAL-TEST.md and confirming a recovery path.
          Package: minibox-mfp 0.3.0-r12. No production secrets are included.
          EOF
          cat > "$DIST_DIR/SBOM.spdx" <<EOF
          SPDXVersion: SPDX-2.3
          DataLicense: CC0-1.0
          SPDXID: SPDXRef-DOCUMENT
          DocumentName: MiniBox-Build-0108-TEST
          DocumentNamespace: https://github.com/desfly/MiniBox-print-scan-server/actions/runs/${GITHUB_RUN_ID}/sbom
          Creator: Tool: GitHub-Actions
          Created: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          PackageName: minibox-firmware-test
          SPDXID: SPDXRef-Package
          PackageVersion: ${GITHUB_SHA}
          PackageDownloadLocation: NOASSERTION
          FilesAnalyzed: false
          PackageLicenseConcluded: NOASSERTION
          PackageLicenseDeclared: NOASSERTION
          PackageCopyrightText: NOASSERTION
          EOF
          (cd "$DIST_DIR" && find . -maxdepth 1 -type f ! -name BUILD-0108-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > BUILD-0108-SHA256SUMS.txt)
      - name: Upload Build-0108 TEST-ONLY
        uses: actions/upload-artifact@v5
        with:
          name: minibox-v1-openwrt-25.12.5-build0108-TEST-r12-${{ github.sha }}
          path: dist-web-upgrade/
          if-no-files-found: error
          retention-days: 30
