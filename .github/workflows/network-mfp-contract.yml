name: MiniBox network MFP contract

on:
  push:
    branches: [main, minibox-network-mfp-discovery-v2, minibox-network-mfp-runtime-v2]
  pull_request:
  workflow_dispatch:

jobs:
  discovery-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile discovery service tests
        run: |
          set -euo pipefail
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            src/minibox-discoveryd/service.c tests/test-discovery-service.c \
            -o /tmp/test-discovery-service
      - name: Validate IPP and eSCL records
        run: /tmp/test-discovery-service
      - name: Validate WSD parser and response contract
        run: |
          set -euo pipefail
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            src/minibox-discoveryd/wsd.c tests/test-wsd.c \
            -o /tmp/test-wsd
          /tmp/test-wsd
      - name: Validate runtime service loading
        run: sh tests/test-discovery-runtime.sh
      - name: Validate DNS-SD query responses
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Isrc/minibox-discoveryd tests/test-mdns-queries.c -o /tmp/test-mdns-queries
          /tmp/test-mdns-queries
      - name: Enforce no-usblp/no-CUPS product rule
        run: |
          set -euo pipefail
          ! grep -RniE '(^|[^A-Za-z])(cupsd|kmod-usb-printer)([^A-Za-z]|$)' \
            overlay src tests --exclude='*.md'
